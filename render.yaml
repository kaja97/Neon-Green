services:
  # ─────────────────────────────────────────────
  # Main Backend (FastAPI)
  # ─────────────────────────────────────────────
  - type: web
    name: neon-farming-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # ── Database (Supabase PostgreSQL) ────────
      # Set this in the Render dashboard — do NOT commit your DB password!
      - key: DATABASE_URL
        sync: false

      # ── Redis (Upstash) ───────────────────────
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false

      # ── JWT ───────────────────────────────────
      - key: JWT_SECRET_KEY
        sync: false

      # ── AI / APIs ─────────────────────────────
      - key: GOOGLE_AI_STUDIO_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false

      # ── Email: Google OAuth Token (JSON string) ─
      - key: GOOGLE_OAUTH_TOKEN_JSON
        sync: false

      # ── Push Notifications (VAPID) ────────────
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        value: mailto:admin@agrifarm.app

      # ── CORS: allow frontend ──────────────────
      - key: FRONTEND_URL
        sync: false

  # ─────────────────────────────────────────────
  # Chat Service — NOT DEPLOYED YET
  # Uncomment when ready to deploy
