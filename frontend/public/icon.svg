<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Container -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)" filter="url(#glow)" />
  
  <!-- Subtle Internal Highlight Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.3" />
  
  <!-- Sprout Icon Glyph in High-Contrast Dark Slate -->
  <g transform="translate(96, 96) scale(13.333)" fill="none" stroke="#022c22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ground line and stem -->
    <path d="M7 20h10" />
    <path d="M10 20c0-4 1-7 2-10" />
    <!-- Left Leaf -->
    <path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4.1 5.5.8z" fill="#022c22" />
    <!-- Right Leaf -->
    <path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z" fill="#022c22" />
  </g>
</svg>
